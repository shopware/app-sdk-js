name: Analyse

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install

            - name: Run tests
              run: bun test

    lint:
        name: Lint and format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: canary # bun lint requires 1.4.5-canary.1 or newer

            - name: Run lint and format checks
              run: bun run lint
